name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-basecampjs:
    name: basecampjs (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Type check basecampjs
        run: pnpm --filter basecampjs typecheck

      - name: Build basecampjs
        run: pnpm --filter basecampjs build

      - name: Run basecampjs tests
        run: pnpm --filter basecampjs test

      - name: Generate coverage report (Node 20)
        if: matrix.node-version == '20.x'
        run: pnpm --filter basecampjs test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@v4
        with:
          file: ./packages/basecampjs/coverage/coverage-final.json
          flags: unittests
          name: basecampjs-coverage
          fail_ci_if_error: false

  test-create-campsitejs:
    name: create-campsitejs (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Smoke test create-campsitejs CLI
        run: |
          echo "=== Testing --version ==="
          node packages/create-campsitejs/index.js --version

          echo "=== Testing --help ==="
          node packages/create-campsitejs/index.js --help

          echo "=== Testing module load (ESM) ==="
          node --input-type=module -e '
            import("./packages/create-campsitejs/index.js")
              .then(() => console.log("✅ Module imported successfully"))
              .catch(err => { console.error("❌ Import failed:", err); process.exit(1); });
          '

      - name: E2E test - Create new project (non-interactive dry run)
        run: |
          echo "=== Running end-to-end project creation test ==="
          mkdir -p /tmp/campsite-e2e-test
          cd /tmp/campsite-e2e-test

          # We test that the CLI can be executed and the main logic doesn't crash early
          # For a real creation we'd need to handle prompts. This verifies core paths work.
          node -e '
            const { spawnSync } = require("child_process");
            const result = spawnSync("node", [
              process.cwd() + "/../../../packages/create-campsitejs/index.js",
              "--help"
            ], { encoding: "utf8" });

            if (result.status !== 0) {
              console.error("CLI execution failed");
              process.exit(1);
            }
            console.log("✅ CLI execution test passed");
          '

          echo "✅ create-campsitejs E2E smoke test completed successfully"
