name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-basecampjs:
    name: basecampjs (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Debug environment
        run: |
          echo "Node version: $(node --version)"
          echo "pnpm version: $(pnpm --version)"
          echo "pnpm store: $(pnpm store path)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check basecampjs
        run: pnpm --filter basecampjs typecheck

      - name: Build basecampjs
        run: pnpm --filter basecampjs build

      - name: Run basecampjs tests
        run: pnpm --filter basecampjs test

      - name: Generate coverage report (Node 20)
        if: matrix.node-version == '20.x'
        run: pnpm --filter basecampjs test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@v4
        with:
          file: ./packages/basecampjs/coverage/coverage-final.json
          flags: unittests
          name: basecampjs-coverage
          fail_ci_if_error: false

  test-create-campsitejs:
    name: create-campsitejs (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Debug environment
        run: |
          echo "Node version: $(node --version)"
          echo "pnpm version: $(pnpm --version)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Smoke tests for create-campsitejs
        run: |
          echo "=== Testing --version ==="
          node packages/create-campsitejs/index.js --version

          echo "=== Testing --help ==="
          node packages/create-campsitejs/index.js --help

          echo "=== Testing ESM module load ==="
          node --input-type=module -e '
            import("./packages/create-campsitejs/index.js")
              .then(() => console.log("✅ ESM import successful"))
              .catch(err => { console.error(err); process.exit(1); });
          '

          echo "✅ All create-campsitejs smoke tests passed"
